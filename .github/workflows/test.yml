name: Test
defaults:
  run:
    shell: bash

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  package:
    name: Pack npm Candidate
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.13.0
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Store npm Candidate
        uses: node-3d/addon-tools/actions/npm-candidate-upload@1073c0a6403f6c20df2135f03950a568e865aa16

  unit-tests:
    name: Unit Tests (${{ matrix.target }}, Node ${{ matrix.node_version }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            os: windows-2022
            node_arch: x64
            node_version: 22.18.0
          - target: windows-x64
            os: windows-2022
            node_arch: x64
            node_version: 24.13.0
          - target: windows-x64
            os: windows-2022
            node_arch: x64
            node_version: 26.8.1
          - target: windows-arm64
            os: windows-11-arm
            node_arch: arm64
            node_version: 24.13.0
          - target: linux-x64
            os: ubuntu-22.04
            node_arch: x64
            node_version: 24.13.0
          - target: linux-arm64
            os: ubuntu-22.04-arm
            node_arch: arm64
            node_version: 24.13.0
          - target: darwin-x64
            os: macos-26-intel
            node_arch: x64
            node_version: 24.13.0
          - target: darwin-arm64
            os: macos-26
            node_arch: arm64
            node_version: 24.13.0
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node_version }}
          architecture: ${{ matrix.node_arch }}
          cache: npm
      - name: Print Native Target
        run: |
          echo "runner=$(uname -s)-$(uname -m)"
          node -p "'node=' + process.version + ' platform=' + process.platform + ' arch=' + process.arch"
          npm config get arch
      - name: Install Modules
        run: npm ci
      - name: Install Mesa Surfaceless EGL - macOS
        if: startsWith(matrix.target, 'darwin-')
        run: bash .github/scripts/setup-macos-gl.sh ${{ matrix.node_arch }}
      - name: Install OpenGL Compatibility Pack - Windows ARM
        shell: pwsh
        if: matrix.target == 'windows-arm64'
        run: |
          $url = "https://github.com/microsoft/OpenCLOn12/releases/download/v1.2404.1.0/Universal_D3DMappingLayers_1.2404.1.0_arm64.appx"
          $file = "d3d-mapping-layers-arm64.appx"
          Invoke-WebRequest -Uri $url -OutFile $file
          Add-AppxPackage -Path $file
          Get-AppxPackage Microsoft.D3DMappingLayers | Format-List Name,PackageFullName,Architecture,InstallLocation
      - uses: ssciwr/setup-mesa-dist-win@v3
        if: matrix.target == 'windows-x64'
      - name: Run Unit Tests - Linux
        if: startsWith(matrix.target, 'linux-')
        run: xvfb-run --auto-servernum npm run test:ci
      - name: Run Unit Tests - Windows
        if: startsWith(matrix.target, 'windows-')
        run: npm run test:ci
      - name: Run Unit Tests - macOS
        if: startsWith(matrix.target, 'darwin-')
        run: npm run test:ci
      - name: Check Diff Artifacts
        id: diff-artifacts
        if: always()
        run: |
          if [ -d test/__diff__ ] && find test/__diff__ -type f | read -r _; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v7
        if: always() && steps.diff-artifacts.outputs.present == 'true'
        with:
          name: __diff__-${{ matrix.target }}-node-${{ matrix.node_version }}
          path: test/__diff__
          retention-days: 1
          compression-level: 0
          overwrite: true

  consumer-tests:
    name: Packed Consumer (${{ matrix.target }})
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            os: windows-2022
            node_arch: x64
          - target: windows-arm64
            os: windows-11-arm
            node_arch: arm64
          - target: linux-x64
            os: ubuntu-22.04
            node_arch: x64
          - target: linux-arm64
            os: ubuntu-22.04-arm
            node_arch: arm64
          - target: darwin-x64
            os: macos-26-intel
            node_arch: x64
          - target: darwin-arm64
            os: macos-26
            node_arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.13.0
          architecture: ${{ matrix.node_arch }}
      - name: Install Packed Consumer Candidate
        id: consumer
        uses: node-3d/addon-tools/actions/consumer-install@1073c0a6403f6c20df2135f03950a568e865aa16
        with:
          package-name: '@node-3d/core'
          fixture: test-consumer
      - name: Install Mesa Surfaceless EGL - macOS
        if: startsWith(matrix.target, 'darwin-')
        working-directory: ${{ steps.consumer.outputs.directory }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/setup-macos-gl.sh" ${{ matrix.node_arch }}
      - name: Install OpenGL Compatibility Pack - Windows ARM
        shell: pwsh
        if: matrix.target == 'windows-arm64'
        run: |
          $url = "https://github.com/microsoft/OpenCLOn12/releases/download/v1.2404.1.0/Universal_D3DMappingLayers_1.2404.1.0_arm64.appx"
          $file = "d3d-mapping-layers-arm64.appx"
          Invoke-WebRequest -Uri $url -OutFile $file
          Add-AppxPackage -Path $file
          Get-AppxPackage Microsoft.D3DMappingLayers | Format-List Name,PackageFullName,Architecture,InstallLocation
      - uses: ssciwr/setup-mesa-dist-win@v3
        if: matrix.target == 'windows-x64'
      - name: Run Packed Consumer Tests - Linux
        if: startsWith(matrix.target, 'linux-')
        working-directory: ${{ steps.consumer.outputs.directory }}
        run: xvfb-run --auto-servernum npm test
      - name: Run Packed Consumer Tests - Windows and macOS
        if: startsWith(matrix.target, 'windows-') || startsWith(matrix.target, 'darwin-')
        working-directory: ${{ steps.consumer.outputs.directory }}
        run: npm test
